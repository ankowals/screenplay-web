plugins {
    id 'java'
    id 'com.diffplug.spotless' version "8.10.2"
}

group 'com.github.ankowals'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    testAnnotationProcessor("org.projectlombok:lombok:1.18.48")
    testCompileOnly("org.projectlombok:lombok:1.18.48")

    //runner
    testImplementation("org.junit.jupiter:junit-jupiter:6.1.3")
    testImplementation("org.junit.platform:junit-platform-launcher:6.1.3")
    testImplementation("org.junit-pioneer:junit-pioneer:2.3.0")
    testImplementation("io.github.glytching:junit-extensions:2.6.0")

    //logging
    testImplementation("ch.qos.logback:logback-core:1.6.3")
    testImplementation("ch.qos.logback:logback-classic:1.6.3")
    testImplementation("org.slf4j:slf4j-api:2.0.19")
    testImplementation("org.slf4j:jul-to-slf4j:2.0.19")
    testImplementation("org.aspectj:aspectjweaver:1.9.25.1")

    //screenplay
    testImplementation("org.apache.commons:commons-lang3:3.20.0")
    testImplementation("org.assertj:assertj-core:4.0.0-M1")
    testImplementation("org.hamcrest:hamcrest:3.0")
    testImplementation("org.awaitility:awaitility:4.3.0")

    //selenium
    testImplementation("org.seleniumhq.selenium:selenium-java:4.49.0")
    testImplementation("io.github.bonigarcia:selenium-jupiter:6.3.2")
    testImplementation("org.jsoup:jsoup:1.23.2")
    testImplementation("com.aventstack:extentreports:5.1.2")
    testImplementation("commons-io:commons-io:2.22.0")
    testImplementation("com.github.romankh3:image-comparison:4.4.0")
    testImplementation("com.deque.html.axe-core:selenium:4.13.0")
    testImplementation("net.bramp.ffmpeg:ffmpeg:0.9.2")
}

test {
    sourceCompatibility = 1.21
    targetCompatibility = 1.21

    //environment "WDM_CHROMEVERSION", "145.0"

    //use it to set path to chrome for testing
    environment "WDM_CHROME_BINARY", ""

    environment "BROWSER_IN_DOCKER_ENABLED", "false"
    environment "BROWSER_IN_HEADLESS_ENABLED", "false"

    //recording via container
    environment "WDM_DOCKERENABLERECORDING", "false"

    //recording via extension or screencasting works in headless & in container
    //when in use switch off recording via container
    environment "BROWSER_WATCHER_ENABLED", "false"

    //recommended way of recording videos, works in headless
    environment "PAGE_SCREENCASTING_ENABLED", "false"

    environment "TRACING_ENABLED", "false"

    environment "ACCESSIBILITY_ASSERTIONS_ENABLED", "true"

    //requires to run com.github.ankowals.tests in container
    environment "VISUAL_ASSERTIONS_ENABLED", "true"
    environment "VISUAL_ASSERTIONS_REPLACE_SCREENSHOTS", "false"

    useJUnitPlatform()

    doFirst {
        def weaver = configurations.testRuntimeClasspath.find { it.name.contains("aspectjweaver") }
        jvmArgs += "-javaagent:$weaver"
        jvmArgs += "--add-opens=java.base/java.util=ALL-UNNAMED"
        jvmArgs += "--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED"
        jvmArgs += "--add-opens=java.base/java.lang=ALL-UNNAMED"
        jvmArgs += "--add-opens=java.base/java.time=ALL-UNNAMED"
        jvmArgs += "--add-opens=java.base/java.time.format=ALL-UNNAMED"
        jvmArgs += "--add-opens=java.base/sun.nio.fs=ALL-UNNAMED"
    }
}

spotless {
    java {
        googleJavaFormat()
    }
}